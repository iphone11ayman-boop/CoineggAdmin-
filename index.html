        const BOT_TOKEN = "8358299061:AAFRQ3RpCgn8BqmrqElt0cTiWB_Z3Jdcf2o";

        // কুইজ ডাটা (১৫০০০ প্রশ্নের জেনারেটর)
        const quizCategories = ['বাংলাদেশ','আন্তর্জাতিক','বিজ্ঞান','প্রযুক্তি','ইতিহাস','ভূগোল','খেলাধুলা','বিনোদন','সাহিত্য','গণিত'];
        function generate15kQuizzes() {
            const quizzes = [];
            for (let i = 0; i < 15000; i++) {
                const category = quizCategories[i % quizCategories.length];
                let q = getBaseQuestion(category, i);
                quizzes.push({ id: i+1, category, question: q.text, options: q.options, correct: q.correct });
            }
            return quizzes;
        }

            const bank = {
                'বাংলাদেশ': { text: 'বাংলাদেশের রাজধানী কোনটি?', options: ['ঢাকা', 'চট্টগ্রাম', 'রাজশাহী', 'খুলনা'], correct: 0 },
                'আন্তর্জাতিক': { text: 'মার্কিন যুক্তরাষ্ট্রের রাজধানী?', options: ['নিউইয়র্ক', 'ওয়াশিংটন ডি.সি.', 'লস এঞ্জেলেস', 'শিকাগো'], correct: 1 },
                'বিজ্ঞান': { text: 'পানির সংকেত কি?', options: ['H2O', 'CO2', 'O2', 'NaCl'], correct: 0 }
            };
            return bank[cat] || bank['বাংলাদেশ'];
        }
        const allQuizzes = generate15kQuizzes();

        // ইউজার ডাটা
        let userData = {
            balance: 0, totalQuizzesCompleted: 0, todayQuizzesCompleted: 0,
            lastQuizDate: new Date().toDateString(),
            completedQuizzes: new Set(), taskCompleted: false,
            selectedMethod: 'bkash', withdrawRequests: []
        };
        let currentQuestion = null, timerInterval = null, timeLeft = 30, selectedOption = null, quizActive = false;

        function loadUserData() {
            const saved = localStorage.getItem('richBoomUserData');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    userData = { ...userData, ...parsed, completedQuizzes: new Set(parsed.completedQuizzes || []) };
                } catch(e) {}
            }
            updateUI();
        }
        function saveUserData() {
            const toSave = { ...userData, completedQuizzes: Array.from(userData.completedQuizzes) };
            localStorage.setItem('richBoomUserData', JSON.stringify(toSave));
        }
        function updateUI() {
            document.getElementById('balanceDisplay').innerText = userData.balance.toFixed(0);
            const today = new Date().toDateString();
            if (userData.lastQuizDate !== today) { userData.todayQuizzesCompleted = 0; userData.lastQuizDate = today; saveUserData(); }
            document.getElementById('todayRemaining').innerText = Math.max(0, 20 - userData.todayQuizzesCompleted);
            document.getElementById('todayEarned').innerText = (userData.todayQuizzesCompleted * 20).toFixed(0);
            document.getElementById('completedQuizzes').innerText = `${userData.totalQuizzesCompleted}/১৫০০০`;
            document.getElementById('quizProgress').style.width = (userData.totalQuizzesCompleted / 15000 * 100) + '%';
            document.getElementById('startQuizBtn').disabled = userData.todayQuizzesCompleted >= 20;
            const taskBtn = document.getElementById('taskBtn');
            if(userData.taskCompleted) taskBtn.innerHTML = '<i class="fab fa-telegram-plane"></i> চ্যানেল আবার খুলুন (বোনাস নেওয়া হয়েছে)';
            else taskBtn.innerHTML = '<i class="fab fa-telegram-plane"></i> চ্যানেল জয়েন করুন +৫০';
            saveUserData();
        }

        // ========== টেলিগ্রাম নোটিফিকেশন ফাংশন (সরাসরি বটে মেসেজ) ==========
        async function sendTelegramWithdrawAlert(method, number, amount, balanceAfter) {
            const message = `🧾 *নতুন উইথড্র অনুরোধ!*\n\n💳 মেথড: ${method === 'bkash' ? 'বিকাশ' : 'নগদ'}\n📞 নাম্বার: ${number}\n💰 পরিমাণ: ${amount} টাকা\n💼 বর্তমান ব্যালেন্স: ${balanceAfter} টাকা\n🕐 সময়: ${new Date().toLocaleString()}\n\n✅ দ্রুত প্রসেস করুন।`;
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: message, parse_mode: 'Markdown' })
                });
                console.log("✅ Telegram notification sent");
            } catch (error) {
                console.error("Telegram send error:", error);
            }
        }

        // পেজ সুইচ
        function switchPage(page, event) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(page + 'Page').classList.add('active');
            document.querySelectorAll('.nav-item-pro').forEach(item => item.classList.remove('active'));
            if(event && event.target) event.target.closest('.nav-item-pro').classList.add('active');
        }

        // কুইজ
        function startQuiz() {
            if (userData.todayQuizzesCompleted >= 20) { showToast('আজকের কুইজ শেষ! আগামীকাল খেলুন'); return; }
            loadNextQuiz();
        }
        function loadNextQuiz() {
            const available = allQuizzes.filter(q => !userData.completedQuizzes.has(q.id));
            if (!available.length) { showToast('সব কুইজ শেষ!'); return; }
            currentQuestion = available[Math.floor(Math.random() * available.length)];
            document.getElementById('quizSection').classList.remove('hidden');
            document.getElementById('homeBottomBtn').classList.add('hidden');
            displayQuestion(); startTimer(); quizActive = true;
        }
        function displayQuestion() {
            document.getElementById('questionText').innerText = currentQuestion.question;
            let html = '';
            currentQuestion.options.forEach((opt, idx) => {
                html += `<button class="option-pro-btn" onclick="selectOption(${idx})"><span class="option-prefix-pro">${String.fromCharCode(65+idx)}</span>${opt}</button>`;
            });
            html += `<button class="btn-pro" style="margin-top:16px;" onclick="submitAnswer()">উত্তর জমা দিন</button>`;
            document.getElementById('optionsContainer').innerHTML = html;
            selectedOption = null;
        }
        function selectOption(idx) {
            document.querySelectorAll('.option-pro-btn').forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');
            selectedOption = idx;
        }
        function startTimer() { timeLeft = 30; updateTimer(); timerInterval = setInterval(() => { timeLeft--; updateTimer(); if (timeLeft <= 0) { clearInterval(timerInterval); handleTimeout(); } }, 1000); }
        function updateTimer() { document.getElementById('timer').innerText = timeLeft; document.getElementById('timerBar').style.width = (timeLeft/30*100)+'%'; }
        function handleTimeout() { showToast('সময় শেষ!'); submitAnswer(true); }
        function submitAnswer(isTimeout = false) {
            if (!quizActive || !currentQuestion) return;
            clearInterval(timerInterval);
            if (selectedOption === null && !isTimeout) { showToast('একটি উত্তর নির্বাচন করুন'); startTimer(); return; }
            processAnswer(isTimeout);
        }
        function processAnswer(isTimeout) {
            const isCorrect = (selectedOption === currentQuestion.correct);
            if (isCorrect && !isTimeout) {
                userData.balance += 20; 
                userData.todayQuizzesCompleted++; 
                userData.totalQuizzesCompleted++; 
                userData.completedQuizzes.add(currentQuestion.id);
                showToast('✅ সঠিক! +২০ টাকা');
            } else showToast('❌ ভুল উত্তর');
            document.querySelectorAll('.option-pro-btn').forEach((btn, idx) => { btn.disabled = true; if (idx === currentQuestion.correct) btn.classList.add('correct'); else if (idx === selectedOption && !isCorrect) btn.classList.add('wrong'); });
            document.querySelector('#optionsContainer button:last-child').disabled = true;
            quizActive = false;
            setTimeout(() => {
                document.getElementById('quizSection').classList.add('hidden');
                document.getElementById('homeBottomBtn').classList.remove('hidden');
                updateUI();
            }, 2000);
        }

        // টাস্ক, রেফার, সাপোর্ট
        function completeTask() { 
            window.open('https://t.me/moneyhostes', '_blank'); 
            if(!userData.taskCompleted){ 
                userData.taskCompleted = true; 
                userData.balance += 50; 
                updateUI(); 
                showToast('🎉 +৫০ টাকা বোনাস'); 
                saveUserData();
            } else showToast('চ্যানেল ওপেন হয়েছে (বোনাস নেওয়া হয়েছে)'); 
        }
        function openReferLink() { window.open('https://t.me/rich_boom_bot?start=r07742666995', '_blank'); showToast('রেফার বট ওপেন হচ্ছে...'); }
        function contactSupport() { window.open('https://t.me/Gitty936', '_blank'); showToast('সাপোর্ট ওপেন হচ্ছে'); }

        // উইথড্র - ১০ টাকা মিনিমাম + বটে মেসেজ
        function selectMethod(m) { 
            userData.selectedMethod = m; 
            document.getElementById('bkashBtn').classList.toggle('active', m==='bkash'); 
            document.getElementById('nagadBtn').classList.toggle('active', m==='nagad'); 
        }
        async function processWithdraw() {
            let number = document.getElementById('withdrawNumber').value.trim();
            let amount = parseFloat(document.getElementById('withdrawAmount').value);
            if (!number || number.length < 11) return showToast('সঠিক মোবাইল নম্বর দিন (01xxxxxxxxx)');
            if (isNaN(amount) || amount < 10) return showToast('ন্যূনতম ১০ টাকা উইথড্র করতে পারবেন');
            if (amount > userData.balance) return showToast('ব্যালেন্স কম! উপার্জন করুন');
            
            // ব্যালেন্স কাটা হবে না, শুধু অনুরোধ রেকর্ড (পরে এডমিন দিবে) কিন্তু আমরা নোটিফিকেশন পাঠাবো
            // তবে ব্যালেন্স কাটতে চাইলে আনকমেন্ট করুন: userData.balance -= amount;
            
            // সেভ করা
            userData.withdrawRequests.push({ 
                method: userData.selectedMethod, 
                number, 
                amount, 
                date: new Date().toISOString(),
                balanceAtRequest: userData.balance
            });
            saveUserData();
            
            // টেলিগ্রাম বটে নোটিফিকেশন (মেথড, নাম্বার, টাকা, ব্যালেন্স)
            await sendTelegramWithdrawAlert(userData.selectedMethod, number, amount, userData.balance);
            
            showToast(`✅ অনুরোধ গৃহীত! ${amount} টাকা উত্তোলনের অনুরোধ প্রশাসককে পাঠানো হয়েছে।`);
            // ফিল্ড ক্লিয়ার
            document.getElementById('withdrawNumber').value = '';
            document.getElementById('withdrawAmount').value = '';
            updateUI();
        }

        function showToast(msg) { 
            let t = document.createElement('div'); 
            t.className = 'toast-pro'; 
            t.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`; 
            document.body.appendChild(t); 
            setTimeout(() => t.remove(), 3000); 
        }

        // গ্লোবাল ফাংশন
        window.startQuiz = startQuiz;
        window.selectOption = selectOption;
        window.submitAnswer = submitAnswer;
        window.completeTask = completeTask;
        window.openReferLink = openReferLink;
        window.contactSupport = contactSupport;
        window.processWithdraw = processWithdraw;
        window.selectMethod = selectMethod;
        window.switchPage = switchPage;

        loadUserData();
        setInterval(updateUI, 30000);
    </script>
</body>
</html>
